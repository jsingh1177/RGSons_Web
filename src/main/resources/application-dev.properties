# Dev profile using Local SQL Server
spring.application.name=RGSons
server.port=8080

# Local SQL Server Configuration (SQL Server Authentication)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;databaseName=RGSons;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.auto-commit=true

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.open-in-view=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

spring.web.resources.add-mappings=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.no-store=true
