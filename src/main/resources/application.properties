spring.application.name=RGSons
server.port=${PORT:8080}

# MS SQL Server Configuration (SQL Auth)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;databaseName=RGSons;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.auto-commit=true

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.open-in-view=true

# Thymeleaf
spring.thymeleaf.check-template-location=false

# Connection Pool Configuration (MongoDB handles pooling internally, but these are kept for reference if needed or can be removed)
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.connection-timeout=30000
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000

# Fix for "Invalid mapping pattern" in SpaController
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# CORS allowlist for local dev and explicit cross-origin deployments
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}

# Logging Configuration
logging.level.root=INFO
logging.level.MJC.RGSons=DEBUG
logging.file.name=Logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
