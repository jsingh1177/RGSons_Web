# Which environment to run when starting from project root
env=dev

# -------- Shared settings (for all envs) --------
logging.level.MJC.RGSons=INFO
rg.session.timeout.minutes=120

# ================= DEV =================
dev.spring.datasource.url=jdbc:sqlserver://localhost;databaseName=RGSons;encrypt=false;trustServerCertificate=true
dev.spring.datasource.username=${DB_USERNAME:sa}
dev.spring.datasource.password=${DB_PASSWORD:}

dev.spring.jpa.hibernate.ddl-auto=none
dev.spring.jpa.show-sql=true

dev.server.port=8080

# ================= UAT (examples / placeholders) =================
uat.spring.datasource.url=jdbc:sqlserver://UAT-SERVER\\SQLEXPRESS;databaseName=RGSons_UAT;encrypt=false;trustServerCertificate=true
uat.spring.datasource.username=${DB_USERNAME:uat_user}
uat.spring.datasource.password=${DB_PASSWORD:}

uat.spring.jpa.hibernate.ddl-auto=none
uat.spring.jpa.show-sql=false

uat.server.port=8080

# ================= PROD (examples / placeholders) =================
prod.spring.datasource.url=jdbc:sqlserver://PROD-SERVER\\SQLEXPRESS;databaseName=RGSons;encrypt=false;trustServerCertificate=true
prod.spring.datasource.username=${DB_USERNAME:prod_user}
prod.spring.datasource.password=${DB_PASSWORD:}

prod.spring.jpa.hibernate.ddl-auto=none
prod.spring.jpa.show-sql=false

prod.server.port=8080
